name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main  # change if your default branch is different
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: |
          npm run build
          npm run export

      - name: Deploy to NalinDalal.github.io
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          external_repository: NalinDalal/NalinDalal.github.io
          publish_branch: main

