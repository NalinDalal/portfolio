name: Update Merged PRs

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest merged PRs
        run: |
          node scripts/updateMergedPRs.js > data/mergedPRs.json
      - name: Commit & push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/mergedPRs.json
          git commit -m "chore: update merged PRs [skip ci]" || echo "No changes"
          git push

